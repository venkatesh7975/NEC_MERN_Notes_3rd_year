<text x="68" y="418" font-family="Arial,sans-serif" font-size="18" fill="#344968">Password verifier</text>
<text x="68" y="450" font-family="Arial,sans-serif" font-size="18" fill="#344968">Session token digest</text>
<text x="68" y="482" font-family="Arial,sans-serif" font-size="18" fill="#344968">Expiration and revocation</text>
