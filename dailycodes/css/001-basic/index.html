<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>001 Basic CSS Example</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; color: #334155; margin: 0; padding: 2rem; }
    .box { background: white; border: 2px solid #cbd5e1; border-radius: 8px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    .title { color: #2563eb; margin-top: 0; }
  </style>
</head>
<body>
  <div class="box">
    <h2 class="title">CSS Box Model Basics</h2>
    <p>This card demonstrates margin, padding, borders, and rounded corners in standard CSS.</p>
  </div>
</body>
</html>
