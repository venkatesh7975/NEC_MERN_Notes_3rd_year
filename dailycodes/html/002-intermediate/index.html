<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>002 Intermediate HTML Form & Tables</title>
</head>
<body>
  <header>
    <h1>LMS Student Registration Portal</h1>
  </header>

  <main>
    <section>
      <h2>Student Enrollment Form</h2>
      <form action="#" method="POST">
        <fieldset>
          <legend>Personal Credentials</legend>

          <label for="fullname">Full Name:</label>
          <input type="text" id="fullname" name="fullname" required minlength="3"><br><br>

          <label for="email">Email Address:</label>
          <input type="email" id="email" name="email" required><br><br>

          <label for="track">Learning Track:</label>
          <select id="track" name="track">
            <option value="frontend">Frontend Developer (React)</option>
            <option value="backend">Backend Engineer (Node/Express)</option>
            <option value="fullstack">Full Stack MERN Mastery</option>
          </select>
        </fieldset><br>

        <button type="submit">Submit Enrollment</button>
      </form>
    </section><br>

    <section>
      <h2>Course Schedule</h2>
      <table border="1" cellpadding="8" cellspacing="0">
        <thead>
          <tr>
            <th>Module</th>
            <th>Duration</th>
            <th>Prerequisite</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>HTML5 & CSS3</td>
            <td>2 Weeks</td>
            <td>None</td>
          </tr>
          <tr>
            <td>JavaScript ES6+</td>
            <td>3 Weeks</td>
            <td>HTML/CSS</td>
          </tr>
          <tr>
            <td>React 19 & State</td>
            <td>4 Weeks</td>
            <td>JavaScript ES6+</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
